<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <form method="POST" class="bg-white p-6 rounded shadow-md w-96">
      {% csrf_token %}
      <h2 class="text-lg font-semibold mb-4">Complete Your Profile</h2>
      <label class="block text-gray-700 text-sm font-bold mb-2"
        >Phone Number</label
      >
      <input
        name="phone_number"
        type="text"
        placeholder="Enter phone number"
        required
        class="border border-gray-300 rounded w-full px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button
        type="submit"
        class="mt-4 bg-blue-700 text-white py-2 px-4 rounded w-full hover:bg-blue-600"
      >
        Submit
      </button>
    </form>
  </body>
</html>
